<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — RoCoffe</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap" rel="stylesheet"><style>
:root{--espresso:#29180f;--cafe:#67432d;--caramelo:#b47b48;--creme:#f5ede2;--papel:#fbf7f0;--verde:#26351d;--linha:rgba(41,24,15,.16)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--creme);color:var(--espresso);font:15px/1.5 Montserrat,sans-serif}.page{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}.visual{background:linear-gradient(0deg,rgba(41,24,15,.3),rgba(41,24,15,.05)),url('assets/rocoffe-hero-v2.webp') 72% center/cover;display:flex;align-items:flex-end;padding:55px;color:white}.visual blockquote{font:500 3rem/1.05 "Playfair Display",serif;max-width:580px;margin:0}.side{display:grid;place-items:center;padding:45px 24px}.card{width:min(430px,100%)}.brand{display:inline-flex;flex-direction:column;align-items:center;color:var(--espresso);text-decoration:none;line-height:1}.brand b{font:600 2.35rem "Playfair Display",serif;letter-spacing:-.07em}.brand small{font-size:.48rem;letter-spacing:.32em;text-transform:uppercase;margin-top:7px}.tabs{display:grid;grid-template-columns:1fr 1fr;margin:32px 0 25px;border-bottom:1px solid var(--linha)}.tabs button{border:0;background:none;padding:15px;font:700 .73rem Montserrat;text-transform:uppercase;letter-spacing:.1em;color:#887566;cursor:pointer}.tabs button.active{color:var(--espresso);border-bottom:3px solid var(--caramelo)}h1{font:600 2.4rem "Playfair Display",serif;margin:0 0 8px}p{color:#766456;margin:0 0 22px}.field{margin:13px 0}.field label{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;margin-bottom:7px}.field input{width:100%;height:50px;border:1px solid var(--linha);background:var(--papel);padding:0 15px;font:inherit}.btn{width:100%;height:52px;border:0;background:var(--espresso);color:white;text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-top:8px;cursor:pointer}.btn:hover{background:var(--cafe)}.feedback{min-height:24px;margin-top:12px;font-size:.8rem}.feedback.error{color:#9b2c1f}.feedback.ok{color:#496432}.hidden{display:none}.back{display:inline-block;margin-top:20px;color:var(--cafe);font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;text-decoration:none}.loader{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(245,237,226,.94);opacity:0;transition:.25s}.loader.visible{opacity:1}.brewer{text-align:center}.cone{width:82px;height:46px;border:5px solid var(--verde);border-top-width:11px;clip-path:polygon(0 0,100% 0,75% 100%,25% 100%);margin:auto}.drip{width:4px;height:58px;margin:auto;background:var(--cafe);animation:pour 1.25s infinite;transform-origin:top}.cup{width:105px;height:58px;margin:auto;border:5px solid var(--verde);border-top:0;border-radius:0 0 55px 55px}.loader p{margin-top:20px;color:var(--espresso);font-weight:600}@keyframes pour{0%,100%{transform:scaleY(.2);opacity:.3}50%{transform:scaleY(1);opacity:1}}@media(max-width:820px){.page{grid-template-columns:1fr}.visual{display:none}.side{padding-top:30px}}
</style></head><body><main class="page"><section class="visual"><blockquote>“Sua jornada pelos cafés de Rondônia começa aqui.”</blockquote></section><section class="side"><div class="card"><a class="brand" href="index.html"><b>RoCoffe</b><small>Cafés de Rondônia</small></a><div class="tabs"><button class="active" data-tab="login">Entrar</button><button data-tab="cadastro">Criar conta</button></div><section id="login-panel"><h1>Que bom ter você aqui.</h1><p>Entre para acompanhar sua experiência RoCoffe.</p><form id="login-form"><div class="field"><label>E-mail</label><input id="login-email" type="email" required autocomplete="email"></div><div class="field"><label>Senha</label><input id="login-password" type="password" required minlength="6" autocomplete="current-password"></div><button class="btn">Entrar</button></form></section><section id="cadastro-panel" class="hidden"><h1>Entre para o clube.</h1><p>Crie sua conta para salvar endereços e acompanhar assinaturas.</p><form id="signup-form"><div class="field"><label>Nome completo</label><input id="signup-name" required autocomplete="name"></div><div class="field"><label>WhatsApp</label><input id="signup-whatsapp" required autocomplete="tel"></div><div class="field"><label>E-mail</label><input id="signup-email" type="email" required autocomplete="email"></div><div class="field"><label>Senha</label><input id="signup-password" type="password" required minlength="6" autocomplete="new-password"></div><button class="btn">Criar minha conta</button></form></section><div id="feedback" class="feedback" aria-live="polite"></div><a class="back" href="index.html">← Voltar para a RoCoffe</a></div></section></main><div id="brewing-loader" class="loader" hidden><div class="brewer"><div class="cone"></div><div class="drip"></div><div class="cup"></div><p data-loading-message>Preparando sua experiência...</p></div></div><script type="module">
import{supabase,saveProfile,showBrewing,hideBrewing,currentUser}from'./supabase-client.js';const next=new URLSearchParams(location.search).get('next')||'minha-conta.html',f=document.querySelector('#feedback');function msg(t,c=''){f.textContent=t;f.className='feedback '+c}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#login-panel').classList.toggle('hidden',b.dataset.tab!=='login');document.querySelector('#cadastro-panel').classList.toggle('hidden',b.dataset.tab!=='cadastro');msg('')});document.querySelector('#login-form').onsubmit=async e=>{e.preventDefault();showBrewing('Reconhecendo seu perfil...');const{data,error}=await supabase.auth.signInWithPassword({email:document.querySelector('#login-email').value,password:document.querySelector('#login-password').value});if(!error&&data.user)await saveProfile(data.user.id,data.user.user_metadata?.full_name||'',data.user.user_metadata?.whatsapp||'');hideBrewing();if(error)return msg('Confira seu e-mail e sua senha.','error');location.href=next};document.querySelector('#signup-form').onsubmit=async e=>{e.preventDefault();showBrewing('Criando sua conta RoCoffe...');const n=document.querySelector('#signup-name').value,w=document.querySelector('#signup-whatsapp').value,{data,error}=await supabase.auth.signUp({email:document.querySelector('#signup-email').value,password:document.querySelector('#signup-password').value,options:{data:{full_name:n,whatsapp:w}}});if(!error&&data.session)await saveProfile(data.user.id,n,w);hideBrewing();if(error)return msg(error.message,'error');if(data.session)location.href=next;else msg('Conta criada! Confirme o e-mail enviado e depois entre.','ok')};if(await currentUser())location.href=next;
</script></body></html>
