    <style>
      :root {

        --cafe: #67432d;

      .loader {

        place-items: center;

        visibility: hidden;
        pointer-events: none;
        transition: 0.25s;
      }
      .loader[hidden] {
        display: none;
      }
      .loader.visible {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }
      .brewer {
        text-align: center;
      }
      .cone {
        width: 82px;
        height: 46px;
        border: 5px solid var(--verde);
        border-top-width: 11px;
        clip-path: polygon(0 0, 100% 0, 75% 100%, 25% 100%);

      }
      .drip {
        width: 4px;
        height: 58px;
        margin: auto;
        background: var(--cafe);
        animation: pour 1.25s infinite;
        transform-origin: top;
      }
      .cup {
        width: 105px;
        height: 58px;
        margin: auto;
        border: 5px solid var(--verde);
        border-top: 0;
        border-radius: 0 0 55px 55px;
      }
      .loader p {
        margin-top: 20px;
        color: var(--espresso);
        font-weight: 600;
      }
      @keyframes pour {
        0%,
        100% {
          transform: scaleY(0.2);
          opacity: 0.3;
        }
        50% {
          transform: scaleY(1);
          opacity: 1;
        }
      }
      @media (max-width: 820px) {
        .page {
          grid-template-columns: 1fr;
        }
        .visual {
          display: none;
        }
        .side {
          padding-top: 30px;
        }
      }

  <body>
    <main class="page">
      <section class="visual">

<style id="rocoffee-loader-styles">
  #brewing-loader.loader {
    position: fixed !important; inset: 0 !important; z-index: 99999 !important;
    display: grid !important; place-items: center !important;
    padding: 24px; background: #253015 !important; color: #f2eadf !important;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .28s ease, visibility .28s ease;
  }
  #brewing-loader.loader.visible { opacity: 1; visibility: visible; pointer-events: auto; }
  #brewing-loader.loader[hidden] { display: none !important; }
  #brewing-loader.loader.is-hiding { opacity: 0; visibility: hidden; pointer-events: none; }
  #brewing-loader .brewing-content { display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 12px; text-align:center; }
  #brewing-loader .brewing-video { display:block; width:min(260px, 68vw); max-height:260px; object-fit:contain; }
  #brewing-loader p { margin:0; color:#f2eadf; font:500 14px/1.5 Montserrat, sans-serif; letter-spacing:.04em; }
  @media (prefers-reduced-motion: reduce) { #brewing-loader { transition:none; } }

<script>
(function () {
  const loader = document.getElementById('brewing-loader');
  if (!loader) return;
  let hideTimer;
  function hideLoader() {
    loader.classList.add('is-hiding');
    loader.classList.remove('visible');
    window.setTimeout(() => { loader.hidden = true; loader.classList.remove('is-hiding'); }, 300);
  }
  window.hideBrewing = window.hideBrewing || hideLoader;
  window.addEventListener('load', () => window.setTimeout(hideLoader, 250), { once: true });
  window.setTimeout(hideLoader, 3500); // Nunca bloquear o site se um vídeo ou recurso externo não terminar de carregar.
  // Fallback for cached pages or scripts that execute after load.
  if (document.readyState === 'complete') window.setTimeout(hideLoader, 450);
  document.addEventListener('click', (event) => {
    const link = event.target.closest('a[href]');
    if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    const href = link.getAttribute('href') || '';
    if (!href || href.startsWith('#') || link.target === '_blank' || link.hasAttribute('download')) return;
    let destination;
    try { destination = new URL(link.href, location.href); } catch (_) { return; }
    if (destination.origin !== location.origin || (destination.pathname === location.pathname && destination.search === location.search)) return;
    loader.hidden = false;
    loader.classList.remove('is-hiding');
    loader.classList.add('visible');
  });
})();
</script>
<script type="module">
      import {
        supabase,
        saveProfile,
        showBrewing,
        hideBrewing,
        currentUser,
      } from "./supabase-client.js";
      const rawNext =
          new URLSearchParams(location.search).get("next") ||
          "minha-conta.html",
        next = /^\/?(assinatura|minha-conta|index|pagamento-retorno)\.html(?:[?#].*)?$/.test(rawNext)
          ? rawNext.replace(/^\/+/, "")
          : "minha-conta.html",
        f = document.querySelector("#feedback");
      function msg(t, c = "") {
        f.textContent = t;
        f.className = "feedback " + c;
      }
      document.querySelectorAll("[data-tab]").forEach(
        (b) =>
          (b.onclick = () => {
            document
              .querySelectorAll("[data-tab]")
              .forEach((x) => x.classList.toggle("active", x === b));
            document
              .querySelector("#login-panel")
              .classList.toggle("hidden", b.dataset.tab !== "login");
            document
              .querySelector("#cadastro-panel")
              .classList.toggle("hidden", b.dataset.tab !== "cadastro");
            msg("");
          }),
      );
      document.querySelector("#login-form").onsubmit = async (e) => {
        e.preventDefault();
        showBrewing("Reconhecendo seu perfil...");
        const { data, error } = await supabase.auth.signInWithPassword({
          email: document.querySelector("#login-email").value,
          password: document.querySelector("#login-password").value,
        });
        if (!error && data.user)
          await saveProfile(
            data.user.id,
            data.user.user_metadata?.full_name || "",
            data.user.user_metadata?.whatsapp || "",
          );
        hideBrewing();
        if (error) return msg("Confira seu e-mail e sua senha.", "error");
        location.href = next;
      };
      document.querySelector("#signup-form").onsubmit = async (e) => {
        e.preventDefault();
        showBrewing("Criando sua conta RoCoffee...");
        const n = document.querySelector("#signup-name").value,
          w = document.querySelector("#signup-whatsapp").value,
          { data, error } = await supabase.auth.signUp({
            email: document.querySelector("#signup-email").value,
            password: document.querySelector("#signup-password").value,
            options: {
              emailRedirectTo: `${location.origin}/login.html?next=${encodeURIComponent(next)}`,
              data: { full_name: n, whatsapp: w },
            },
          });
        if (!error && data.session) await saveProfile(data.user.id, n, w);
        hideBrewing();
        if (error) return msg(error.message, "error");
        if (data.session) location.href = next;
        else
          msg("Conta criada! Confirme o e-mail enviado e depois entre.", "ok");
      };
      if (await currentUser()) location.href = next;
    </script>
