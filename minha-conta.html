<style id="rocoffee-loader-styles">
  #brewing-loader.loader {
    position: fixed !important; inset: 0 !important; z-index: 99999 !important;
    display: grid !important; place-items: center !important;
    padding: 24px; background: #253015 !important; color: #f2eadf !important;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity .28s ease, visibility .28s ease;
  }
  #brewing-loader.loader.visible { opacity: 1; visibility: visible; pointer-events: auto; }
  #brewing-loader.loader[hidden] { display: none !important; }
  #brewing-loader.loader.is-hiding { opacity: 0; visibility: hidden; pointer-events: none; }
  #brewing-loader .brewing-content { display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 12px; text-align:center; }
  #brewing-loader .brewing-video { display:block; width:min(260px, 68vw); max-height:260px; object-fit:contain; }

<script>
(function () {
  const loader = document.getElementById('brewing-loader');
  if (!loader) return;
  let hideTimer;
  function hideLoader() {
    loader.classList.add('is-hiding');
    loader.classList.remove('visible');
    window.setTimeout(() => { loader.hidden = true; loader.classList.remove('is-hiding'); }, 300);
  }
  window.hideBrewing = window.hideBrewing || hideLoader;
  window.addEventListener('load', () => window.setTimeout(hideLoader, 250), { once: true });
  window.setTimeout(hideLoader, 3500); // Nunca bloquear o site se um vídeo ou recurso externo não terminar de carregar.
  // Fallback for cached pages or scripts that execute after load.
  if (document.readyState === 'complete') window.setTimeout(hideLoader, 450);
  document.addEventListener('click', (event) => {
    const link = event.target.closest('a[href]');
    if (!link || event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    const href = link.getAttribute('href') || '';
    if (!href || href.startsWith('#') || link.target === '_blank' || link.hasAttribute('download')) return;
    let destination;
    try { destination = new URL(link.href, location.href); } catch (_) { return; }
    if (destination.origin !== location.origin || (destination.pathname === location.pathname && destination.search === location.search)) return;
    loader.hidden = false;
    loader.classList.remove('is-hiding');
    loader.classList.add('visible');
  });
})();
</script>
<script type="module">
      import {
        currentUser,
        supabase,
        showBrewing,
        hideBrewing,
      } from "./supabase-client.js";
      const u = await currentUser();
      if (!u) location.href = "login.html?next=minha-conta.html";
      else {
        const [{ data: p }, { data: s }, { data: a }] = await Promise.all([
          supabase
            .from("profiles")
            .select("*")
            .eq("user_id", u.id)
            .maybeSingle(),
          supabase
            .from("subscriptions")
            .select("*")
            .order("created_at", { ascending: false }),
          supabase
            .from("addresses")
            .select("*")
            .order("created_at", { ascending: false }),
        ]);
        document.querySelector("#customer-name").textContent =
          p?.full_name?.split(" ")[0] ||
          u.user_metadata?.full_name?.split(" ")[0] ||
          "assinante";
        if (s?.length)
          document.querySelector("#subscriptions").innerHTML = s
            .map(
              (x) =>
                `<div class="item"><strong>${x.plan}</strong><small>${x.frequency} • ${x.grind} • ${x.status === "active" ? "Pagamento aprovado" : x.status === "payment_failed" ? "Pagamento não aprovado" : "Aguardando pagamento"}</small>${x.status !== "active" ? `<button class="btn pay-pending" data-id="${x.id}">Pagar agora</button>` : ""}</div>`,
            )
            .join("");
        if (a?.length)
          document.querySelector("#addresses").innerHTML = a
            .map(
              (x) =>
                `<div class="item"><strong>${x.label}</strong><small>${x.street}, ${x.number} — ${x.city}/${x.state}</small></div>`,
            )
            .join("");
        document.querySelector("#account-loader")?.remove();
        document.querySelectorAll(".pay-pending").forEach((button) => {
          button.onclick = async () => {
            button.disabled = true;
            const { data, error } = await supabase.functions.invoke(
              "create-mercado-pago-preference",
              { body: { subscription_id: button.dataset.id } },
            );
            if (error || !data?.checkout_url) {
              button.disabled = false;
              return alert(
                data?.error || "O Mercado Pago ainda está em configuração.",
              );
            }
            location.href = data.checkout_url;
          };
        });
      }
      document.querySelector("#logout").onclick = async (event) => {
        const button = event.currentTarget;
        button.disabled = true;
        try {
          const { error } = await supabase.auth.signOut();
          if (error) throw error;
          window.location.replace("index.html");
        } catch (error) {
          console.error("Erro ao sair da conta:", error);
          alert("Não foi possível sair da conta. Tente novamente.");
          button.disabled = false;
        }
      };
