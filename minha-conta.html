<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Minha conta — RoCoffe</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --espresso: #29180f;
        --cafe: #67432d;
        --creme: #f5ede2;
        --papel: #fffaf3;
        --verde: #26351d;
        --linha: rgba(41, 24, 15, 0.16);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--creme);
        color: var(--espresso);
        font:
          15px/1.55 Montserrat,
          sans-serif;
      }
      .top {
        background: var(--espresso);
        color: white;
        padding: 10px;
        text-align: center;
        font-size: 0.65rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .nav,
      .wrap {
        width: min(1080px, calc(100% - 34px));
        margin: auto;
      }
      .nav {
        height: 82px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo {
        font:
          600 2rem "Playfair Display",
          serif;
        color: inherit;
        text-decoration: none;
      }
      .nav button {
        border: 1px solid var(--espresso);
        background: transparent;
        padding: 10px 14px;
        text-transform: uppercase;
        font-weight: 700;
        font-size: 0.68rem;
      }
      .hero {
        background: var(--cafe);
        color: white;
        padding: 60px 0;
      }
      .hero h1 {
        font:
          600 clamp(2.8rem, 6vw, 5rem) / 1 "Playfair Display",
          serif;
        margin: 10px 0;
      }
      .hero p {
        opacity: 0.72;
      }
      .content {
        padding: 48px 0 80px;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .card {
        background: var(--papel);
        border: 1px solid var(--linha);
        padding: 28px;
      }
      .card h2 {
        font:
          600 1.7rem "Playfair Display",
          serif;
        margin: 0 0 18px;
      }
      .item {
        padding: 16px 0;
        border-top: 1px solid var(--linha);
      }
      .item:first-of-type {
        border-top: 0;
      }
      .item strong {
        display: block;
      }
      .item small,
      .empty {
        color: #7b6758;
      }
      .btn {
        display: inline-flex;
        background: var(--verde);
        color: white;
        padding: 14px 18px;
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        font-size: 0.68rem;
        font-weight: 700;
        margin-top: 18px;
      }
      .loader {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--creme);
        z-index: 20;
      }
      .drip {
        height: 65px;
        width: 4px;
        background: var(--cafe);
        margin: auto;
        animation: pour 1s infinite;
      }
      .cup {
        width: 100px;
        height: 58px;
        border: 5px solid var(--verde);
        border-top: 0;
        border-radius: 0 0 50px 50px;
      }
      .loader p {
        font-weight: 600;
      }
      @keyframes pour {
        50% {
          transform: scaleY(0.25);
          opacity: 0.3;
        }
      }
      @media (max-width: 720px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="top">Seu clube amazônico</div>
    <nav class="nav">
      <a class="logo" href="index.html">RoCoffe</a
      ><button id="logout">Sair</button>
    </nav>
    <header class="hero">
      <div class="wrap">
        <small>MINHA CONTA</small>
        <h1>Olá, <span id="customer-name">assinante</span>.</h1>
        <p>Acompanhe sua jornada pelos cafés de Rondônia.</p>
      </div>
    </header>
    <main class="content wrap">
      <div class="grid">
        <section class="card">
          <h2>Minhas assinaturas</h2>
          <div id="subscriptions">
            <p class="empty">Você ainda não iniciou uma assinatura.</p>
          </div>
          <a class="btn" href="assinatura.html">Escolher experiência</a>
        </section>
        <section class="card">
          <h2>Endereços salvos</h2>
          <div id="addresses"><p class="empty">Nenhum endereço salvo.</p></div>
          <a class="btn" href="assinatura.html?retomar=1#endereco"
            >Adicionar endereço</a
          >
        </section>
      </div>
    </main>
    <div class="loader" id="account-loader">
      <div>
        <div class="drip"></div>
        <div class="cup"></div>
        <p>Buscando suas histórias...</p>
      </div>
    </div>
    <script type="module">
      import { currentUser, supabase } from "./supabase-client.js";
      const u = await currentUser();
      if (!u) location.href = "login.html?next=minha-conta.html";
      else {
        const [{ data: p }, { data: s }, { data: a }] = await Promise.all([
          supabase
            .from("profiles")
            .select("*")
            .eq("user_id", u.id)
            .maybeSingle(),
          supabase
            .from("subscriptions")
            .select("*")
            .order("created_at", { ascending: false }),
          supabase
            .from("addresses")
            .select("*")
            .order("created_at", { ascending: false }),
        ]);
        document.querySelector("#customer-name").textContent =
          p?.full_name?.split(" ")[0] ||
          u.user_metadata?.full_name?.split(" ")[0] ||
          "assinante";
        if (s?.length)
          document.querySelector("#subscriptions").innerHTML = s
            .map(
              (x) =>
                `<div class="item"><strong>${x.plan}</strong><small>${x.frequency} • ${x.grind} • ${x.status}</small></div>`,
            )
            .join("");
        if (a?.length)
          document.querySelector("#addresses").innerHTML = a
            .map(
              (x) =>
                `<div class="item"><strong>${x.label}</strong><small>${x.street}, ${x.number} — ${x.city}/${x.state}</small></div>`,
            )
            .join("");
        document.querySelector("#account-loader").remove();
      }
      document.querySelector("#logout").onclick = async () => {
        await supabase.auth.signOut();
        location.href = "index.html";
      };
    </script>
  </body>
</html>
